version: '3.8'

services:
  # ── Redis (Session state, Socket.IO adapter, concurrency queue) ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Browserless removed — using local Playwright/Chromium instead (saves 8GB RAM)
  # To re-enable, uncomment and set BROWSER_WS_ENDPOINT in backend/.env

  # ── Backend (Node.js + Socket.IO) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - STT_BASE_URL=http://stt-server:8787
      - TTS_BASE_URL=http://tts-server:8000
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - MAX_SESSION_DURATION_SECONDS=300
      - MAX_CONCURRENT_SESSIONS=50
    depends_on:
      redis:
        condition: service_healthy
      stt-server:
        condition: service_started
      tts-server:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  stt-server:
    build:
      context: ./servers
      dockerfile: Dockerfile
    command: [ "python", "stt_server.py" ]
    ports:
      - "8787:8787"
    restart: unless-stopped
    # Use host IPC for better performance with local models if needed
    ipc: host

  tts-server:
    build:
      context: ./servers
      dockerfile: Dockerfile
    command: [ "python", "tts_server.py" ]
    ports:
      - "8000:8000"
    restart: unless-stopped
    # No exposed API key needed since it uses edge-tts

  keyframe-agent:
    build:
      context: ./servers
      dockerfile: Dockerfile
    command: [ "python", "keyframe_agent.py", "start" ]
    env_file:
      - ./backend/.env # Reuse backend env for LiveKit keys
    environment:
      - TTS_BASE_URL=http://tts-server:8000
    depends_on:
      - tts-server
    restart: unless-stopped

volumes:
  redis_data:
