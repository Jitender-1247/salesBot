version: '3.8'

services:
  # ── Redis (Session state, Socket.IO adapter, concurrency queue) ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Browserless (Remote Chrome browser pool) ──
  # Isolates Chromium from the backend process, preventing OOM crashes.
  # Each demo session gets its own browser context inside this container.
  browserless:
    image: browserless/chrome:latest
    ports:
      - "3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=20
      - CONNECTION_TIMEOUT=300000  # 5 minutes — matches MAX_SESSION_DURATION_SECONDS
      - PREBOOT_CHROME=true        # Keep Chrome instances warm for faster cold starts
      - DEMO_MODE=false
      - ENABLE_DEBUGGER=false
      - TOKEN=salesbot-browser-token  # Secure the endpoint
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G  # Cap memory — prevents runaway tabs from killing the host
        reservations:
          memory: 2G

  # ── Backend (Node.js + Socket.IO) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - STT_BASE_URL=http://stt-server:8787
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - BROWSER_WS_ENDPOINT=ws://browserless:3000?token=salesbot-browser-token
      - MAX_SESSION_DURATION_SECONDS=300
      - MAX_CONCURRENT_SESSIONS=50
    depends_on:
      redis:
        condition: service_healthy
      stt-server:
        condition: service_started
      browserless:
        condition: service_started
    restart: unless-stopped

  stt-server:
    build:
      context: ./servers
      dockerfile: Dockerfile
    command: [ "python", "stt_server.py" ]
    ports:
      - "8787:8787"
    restart: unless-stopped
    # Use host IPC for better performance with local models if needed
    ipc: host

  tts-server:
    build:
      context: ./servers
      dockerfile: Dockerfile
    command: [ "python", "tts_server.py" ]
    ports:
      - "8000:8000"
    restart: unless-stopped
    # No exposed API key needed since it uses edge-tts

  keyframe-agent:
    build:
      context: ./servers
      dockerfile: Dockerfile
    command: [ "python", "keyframe_agent.py", "start" ]
    env_file:
      - ./backend/.env # Reuse backend env for LiveKit keys
    environment:
      - TTS_BASE_URL=http://tts-server:8000
    depends_on:
      - tts-server
    restart: unless-stopped

volumes:
  redis_data:
