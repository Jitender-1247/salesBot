# Nginx config — place at /etc/nginx/sites-available/salesbot
# Then: sudo ln -s /etc/nginx/sites-available/salesbot /etc/nginx/sites-enabled/
# And:  sudo certbot --nginx -d api.yourdomain.com
# Or just run without a domain using raw EC2 IP (HTTP only)

server {
    listen 80;
    server_name _;  # Replace _ with your domain if you have one

    # Backend API + Socket.IO
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # WebSocket support (required for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large payloads for audio blobs
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }
}
