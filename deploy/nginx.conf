server {
    listen 80;
    listen [::]:80;
    server_name 56.228.25.198.nip.io 13.60.189.118.nip.io _;

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 56.228.25.198.nip.io 13.60.189.118.nip.io _;

    # SSL Certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/13.60.189.118.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.60.189.118.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Largest legitimate payload is ~10 MB (Socket.IO audio / D-ID audio)
    client_max_body_size 12M;
    server_tokens off;

    # HSTS: browsers only ever use HTTPS for this host
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 1. Dashboard SPA
    location /dashboard {
        root /var/www/salesbot;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. Widget SPA (Live Browser Demo)
    location /widget {
        root /var/www/salesbot;
        index index.html;
        try_files $uri $uri/ /widget/index.html;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 3. Widget2 SPA (1-on-1 Avatar Chat)
    location /widget2 {
        root /var/www/salesbot;
        index index.html;
        try_files $uri $uri/ /widget2/index.html;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 3b. Widget3 SPA (SaleAssist-Style Video Sales Agent)
    location /widget3 {
        root /var/www/salesbot;
        index index.html;
        try_files $uri $uri/ /widget3/index.html;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 4. Embed Scripts (agent.js, chat-agent.js, video-agent.js)
    location ~* ^/(agent\.js|chat-agent\.js|video-agent\.js)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    # 5. Backend API Routes
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 6. WebSocket / Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 7. Root Redirect to Dashboard
    location = / {
        return 301 /dashboard/;
    }
}
